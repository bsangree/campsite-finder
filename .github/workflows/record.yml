name: record-availability

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (GitHub may delay under load)
  workflow_dispatch:          # allow manual run

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Poll parks
        env:
          POLL_SKIP: rc  # ReserveCalifornia 403s GitHub IPs (2026-07-17, probe-confirmed) — see CLAUDE.md
        run: python3 scripts/poll.py >> data-branch/log.jsonl

      - name: Stats + watch notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/stats.py data-branch/log.jsonl --notify > data-branch/stats.json

      - name: Commit
        run: |
          cd data-branch
          git config user.name  "availability-bot"
          git config user.email "actions@github.com"
          LINES=$(wc -l < log.jsonl)
          git add log.jsonl stats.json
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%MZ) — ${LINES} obs" || echo "no changes"
          git push
